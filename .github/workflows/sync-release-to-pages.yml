name: Sync Release Files to /update/ (Main Branch)

on:
  release:
    types: [published]

jobs:
  copy-release-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download release assets
        uses: robinraju/release-downloader@v1.9
        with:
          repository: ikepacheco/LauncherUpdate
          tag: ${{ github.event.release.tag_name }}
          out-file-path: release_assets
          extract: false

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Replace /update/ with latest release assets
        run: |
          rm -rf main/update
          mkdir -p main/update
          cp -a release_assets/. main/update/

      - name: Check /update/ folder size
        shell: bash
        run: |
          echo "Tamaño total de main/update:"
          du -sh main/update

          echo "Archivos más pesados:"
          find main/update -type f -exec du -h {} + | sort -hr | head -50

      - name: Stop if /update/ is too large
        shell: bash
        run: |
          SIZE=$(du -sb main/update | cut -f1)
          MAX=900000000

          echo "main/update size: $SIZE bytes"

          if [ "$SIZE" -gt "$MAX" ]; then
            echo "ERROR: main/update pesa más de 900 MB. No se hará commit para evitar romper GitHub Pages."
            exit 1
          fi

      - name: Commit and push to main
        run: |
          cd main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/
          git commit -m "Update release assets to /update from ${{ github.event.release.tag_name }}" || echo "No changes"
          git push